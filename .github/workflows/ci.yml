name: Admin library
on: [push, pull_request]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: npm pack --dry-run
